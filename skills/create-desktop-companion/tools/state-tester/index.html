<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宠物状态实验室 · Pet State Lab</title><style>
:root{font:15px system-ui,sans-serif;color:#e9edf6;background:#10131c;color-scheme:dark}*{box-sizing:border-box}body{max-width:1180px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}p{line-height:1.6;color:#adb8ce}.notice{padding:12px 16px;background:#222636;border-left:3px solid #b7a2ff;border-radius:8px}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px;margin-top:18px}.panel{background:#191e2c;border:1px solid #30384c;border-radius:16px;padding:18px}button,select,input,textarea{font:inherit;border-radius:8px;border:1px solid #48526a;background:#252d40;color:inherit;padding:8px}button{cursor:pointer}button:hover{border-color:#b7a2ff}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#6750be}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}label{display:block;margin:12px 0 5px}input[type=number]{width:80px}input[type=range]{width:100%}.stage{min-height:440px;display:flex;align-items:center;justify-content:center;overflow:auto;border-radius:12px;background-color:#363d4a;background-image:conic-gradient(#414957 25%,transparent 0 50%,#414957 0 75%,transparent 0);background-size:24px 24px}canvas{flex-shrink:0;outline:1px dashed #8893a880}.status{font:13px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;min-height:75px}h2{font-size:17px;margin-top:0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.active{border-color:#b7a2ff;background:#433365}.tiny{font-size:12px}#error{color:#ffb2ae}summary{cursor:pointer} @media(max-width:760px){body{padding:12px}.layout{grid-template-columns:1fr}.stage{min-height:300px}header{gap:10px}h1{font-size:21px}}
</style><header><h1 data-i="title"></h1><button id="language">English</button></header><p class="notice" data-i="notice"></p>
<div class="layout"><section class="panel"><h2 data-i="source"></h2><input type="file" id="file" accept="image/png,image/webp,.png,.webp"><p class="tiny" data-i="formats"></p><div id="error" role="alert"></div><div id="asset" class="status"></div><h2 data-i="actions"></h2><div id="actions" class="actions"></div><label data-i="gaze" for="gaze"></label><select id="gaze" disabled></select><p class="tiny" data-i="gazeNote"></p><label for="fps" data-i="fps"></label><input type="number" id="fps" min="1" max="60" value="8"> <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select><label><input type="checkbox" id="loop" checked> <span data-i="loop"></span></label><label for="scale" data-i="scale"></label><select id="scale"><option value="1">1× · 192 × 208</option><option value="1.5">1.5×</option><option value="2" selected>2×</option><option value="3">3×</option></select><label for="background" data-i="background"></label><select id="background"><option value="checker" data-i="checker"></option><option value="#ffffff" data-i="white"></option><option value="#10131c" data-i="dark"></option><option value="#777777" data-i="gray"></option></select></section>
<section class="panel"><div class="stage" id="stage"><canvas id="canvas" width="192" height="208" aria-label="Pet atlas cell preview"></canvas></div><div id="status" class="status" aria-live="polite"></div><div class="buttons"><button id="play" class="primary" data-i="play"></button><button id="pause" data-i="pause"></button><button id="prev" data-i="prev"></button><button id="next" data-i="next"></button></div><input type="range" id="frame" min="0" max="5" value="0" aria-label="Frame"><div class="buttons"><button id="all" data-i="all"></button><button id="seam" data-i="seam"></button><button id="interrupt" data-i="interrupt"></button></div><p class="tiny" data-i="sequenceNote"></p><label for="target" data-i="target"></label><select id="target"></select><div class="buttons"><button id="jump" data-i="jump"></button></div><details><summary data-i="qa"></summary><p class="tiny" data-i="qaNote"></p><label for="verdict" data-i="verdict"></label><select id="verdict"><option value="unreviewed" data-i="unreviewed"></option><option value="pass" data-i="pass"></option><option value="issue" data-i="issue"></option></select><label for="notes" data-i="notes"></label><textarea id="notes"></textarea><div class="buttons"><button id="save" data-i="save"></button><button id="export" data-i="export"></button></div><div id="coverage" class="status"></div></details></section></div>
<script src="tester.js"></script></html>
